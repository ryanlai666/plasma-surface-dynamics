[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plasma-surface-lab"
version = "0.1.0"
description = "Reproducible reduced-order and stochastic plasma-surface research workflows"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]
atomistic = ["ase>=3.23"]

[project.scripts]
plasma-lab = "plasma_surface.cli:main"

[tool.setuptools.packages.find]
include = ["plasma_surface*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
